<!doctype html>
<html lang="am">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Puppies Page</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
  
    <header class="header">
      <h1>Puppies Page</h1>
    </header>
    <section class="hero-section">
      <img src="images/banner-puppies.jpg" alt="Puppies in a basket" />
    </section> 
    <div class="page-wrapper">
      <main class="content-container">
        <div class="three-box">
          <div class="card">
            <img src="images/puppy-1.jpg" alt="White Puppy" />
          </div>
          <div class="card missing-card">
            <p>Puppy missing here!!</p>
          </div>
          <div class="card">
            <img src="images/puppy-2.jpg" alt="Dark Puppy" />
          </div>
        </div>
        <div class="section-title">
          <h2>More Puppies</h2>
        </div>
        <div class="two-puppys">
          <div class="card">
            <img src="images/puppy-3.jpg" alt="Brown Puppy" />
          </div>
          <div class="card">
            <img src="images/puppy-4.jpg" alt="Fluffy Puppy" />
          </div>
        </div>
      </main>
    </div>
    <footer class="footer">
      <p>Developed by: Seada</p>
    </footer>
  </body>
</html>
